<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tolemi Architecture Diagram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #ffffff;
    color: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* The diagram has a fixed aspect ratio (1100:560) but scales to fit the viewport */
  .diagram {
    position: relative;
    width: 1100px;
    height: 560px;
    transform-origin: center center;
  }

  /* ==========================================================
     Flip cards
     ========================================================== */
  .flip-card { perspective: 300px; }

  .flip-card-inner {
    position: relative;
    width: 100%; height: 100%;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }

  .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }

  .flip-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: inherit;
    overflow: hidden;
  }

  .flip-back { transform: rotateY(180deg); }

  /* ==========================================================
     Cities
     ========================================================== */
  .cities-box {
    position: absolute;
    left: 0; top: 50px;
    width: 180px;
    height: 400px;
    border: 2px solid #d0d0e0;
    border-radius: 12px;
    background: #f5f5fa;
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .cities-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
    flex: 1;
    align-content: start;
  }

  .city-seal {
    width: 100%; aspect-ratio: 1;
    border-radius: 50%;
    background: #e8e8f0;
    border: 1px solid #d0d0dd;
  }

  .city-seal .flip-face { border-radius: 50%; }
  .city-seal img {
    width: 100%; height: 100%;
    object-fit: cover; border-radius: 50%;
  }

  /* ==========================================================
     Data sources
     ========================================================== */
  .sources-col {
    position: absolute;
    left: 220px; top: 120px;
    width: 90px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .source-slot {
    width: 90px; height: 38px;
    border-radius: 5px;
  }

  .source-slot .flip-face {
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .source-slot img {
    height: 32px; width: 82px;
    object-fit: contain;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 2px 4px;
  }

  /* ==========================================================
     Angel
     ========================================================== */
  .angel {
    position: absolute;
    left: 380px; top: 120px;
    width: 170px;
    height: 260px;
    border: 2.5px solid #7c3aed;
    border-radius: 14px;
    background: linear-gradient(170deg, #ede9fe, #ddd6fe);
    box-shadow: 0 0 25px rgba(124, 58, 237, 0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 2;
  }

  .angel .label { font-size: 1.2rem; font-weight: 700; color: #5b21b6; }
  .angel .sublabel { font-size: 0.7rem; color: #7c3aed; margin-top: 0.2rem; }

  /* ==========================================================
     Database
     ========================================================== */
  .database {
    position: absolute;
    left: 710px; top: 100px;
    width: 180px;
    height: 85px;
    border: 2px solid #d0d0e0;
    border-radius: 12px;
    background: #f5f5fa;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.5rem;
  }

  .db-icon { width: 28px; height: 28px; margin-bottom: 0.15rem; }
  .database .label { font-size: 0.8rem; font-weight: 600; color: #333; }

  /* ==========================================================
     CityGraph
     ========================================================== */
  .citygraph {
    position: absolute;
    left: 710px; top: 215px;
    width: 180px;
    height: 60px;
    border: 2px solid #93c5fd;
    border-radius: 12px;
    background: #eff6ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .citygraph .label { font-size: 0.85rem; font-weight: 600; color: #1e40af; }
  .citygraph .sublabel { font-size: 0.6rem; color: #3b82f6; margin-top: 0.1rem; }

  /* ==========================================================
     Products
     ========================================================== */
  .product {
    position: absolute;
    width: 120px; height: 48px;
    border: 2px solid #93c5fd;
    border-radius: 10px;
    background: #eff6ff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .product .label { font-size: 0.72rem; font-weight: 600; color: #1e40af; }

  .product-publicity { left: 610px; top: 310px; }
  .product-bb        { left: 740px; top: 310px; }
  .product-slate     { left: 870px; top: 310px; }

  /* ==========================================================
     SVG arrows
     ========================================================== */
  svg.arrows {
    position: absolute;
    left: 0; top: 0;
    width: 1100px; height: 560px;
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="diagram" id="diagram">

  <div class="cities-box">
    <div class="cities-grid" id="cities-grid"></div>
  </div>

  <div class="sources-col" id="sources-col"></div>

  <div class="angel">
    <span class="label">Angel</span>
    <span class="sublabel">Elixir ETL</span>
  </div>

  <div class="database">
    <svg class="db-icon" viewBox="0 0 32 32" fill="none">
      <ellipse cx="16" cy="7" rx="12" ry="5" stroke="#888" stroke-width="1.5" fill="#e8e8f0"/>
      <path d="M4 7v18c0 2.76 5.37 5 12 5s12-2.24 12-5V7" stroke="#888" stroke-width="1.5" fill="none"/>
      <ellipse cx="16" cy="16" rx="12" ry="5" stroke="#888" stroke-width="1.5" fill="none"/>
      <ellipse cx="16" cy="25" rx="12" ry="5" stroke="#888" stroke-width="1.5" fill="none"/>
    </svg>
    <span class="label">Postgres + PostGIS</span>
  </div>

  <div class="citygraph">
    <span class="label">CityGraph</span>
    <span class="sublabel">Node.js API</span>
  </div>

  <div class="product product-publicity"><span class="label">Publicity</span></div>
  <div class="product product-bb"><span class="label">Building Blocks</span></div>
  <div class="product product-slate"><span class="label">Slate</span></div>

  <svg class="arrows" viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#999" />
      </marker>
      <marker id="arr-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#7c3aed" />
      </marker>
      <marker id="arr-b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
      </marker>
    </defs>

    <g id="source-lines"></g>

    <!-- Angel → Database -->
    <path d="M 550 250 L 670 250 Q 680 250 680 240 L 680 152 Q 680 142 690 142 L 708 142"
          stroke="#999" stroke-width="2" fill="none" marker-end="url(#arr)" />

    <!-- Database → CityGraph -->
    <line x1="800" y1="185" x2="800" y2="213"
          stroke="#999" stroke-width="2" marker-end="url(#arr)" />

    <!-- CityGraph → products -->
    <line x1="800" y1="275" x2="800" y2="308"
          stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-b)" />

    <path d="M 775 275 L 775 288 Q 775 298 765 298 L 680 298 Q 670 298 670 308"
          stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arr-b)" />

    <path d="M 825 275 L 825 288 Q 825 298 835 298 L 920 298 Q 930 298 930 308"
          stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arr-b)" />

    <!-- Feedback: products → cities (underneath) -->
    <path d="M 670 358 L 670 470 Q 670 480 660 480 L 60 480 Q 50 480 50 470 L 50 452"
          stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 3" fill="none" marker-end="url(#arr-b)" />

    <path d="M 800 358 L 800 490 Q 800 500 790 500 L 100 500 Q 90 500 90 490 L 90 452"
          stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 3" fill="none" marker-end="url(#arr-b)" />

    <path d="M 930 358 L 930 510 Q 930 520 920 520 L 140 520 Q 130 520 130 510 L 130 452"
          stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 3" fill="none" marker-end="url(#arr-b)" />
  </svg>

</div>

<script>
  // ---- Scale diagram to fit viewport ----
  function scaleDiagram() {
    const el = document.getElementById('diagram');
    const scaleX = window.innerWidth / 1100;
    const scaleY = window.innerHeight / 560;
    const scale = Math.min(scaleX, scaleY, 1.2) * 0.95; // 0.95 for a little breathing room
    el.style.transform = `scale(${scale})`;
  }
  scaleDiagram();
  window.addEventListener('resize', scaleDiagram);

  // ---- Data ----
  const ALL_SEAL_IDS = [
    57,58,59,60,61,63,68,70,73,74,75,77,79,81,83,88,89,90,91,99,
    100,101,102,103,105,108,110,112,114,116,118,120,124,125,126,127,
    128,130,131,132,133,134,135,136,137,139,140,143,144,145,146,147,
    148,149,150,151,153,154,155,156,157,158,159,160,161,162,163,164,
    165,166,168,169,170,171,172,173,174,175,176,177,178,179,180,181,
    182,183,184,186,187,188,189,190,191,192,193,194,195,196,197,198,
    199,200,201,202,204,205,206,208,209,210,211,212,213,220,222,224,
    225,226,227,228,229,230,231,232,233,234,235,236,237,238,239,240,
    254,258,259,260,261,262,263,264,265,266,267,268,269,270,271,272
  ];

  const FALLBACK_SOURCES = [
    "1707613.png","20_0925_seal-fema-500.jpg.webp","2476481.webp","26012.png",
    "637825088605130000.png","ATTOM_LOGO.jpg","ArcGIS_globe.png",
    "CKAN_Logo_full_color.png","Microsoft_Excel-Logo.wine.svg","Munis-logo.png",
    "New_Municity_Logo_2021.png","Socrata_Logo.jpg","Tyler_Technologies_logo.svg",
    "airtable-database-spreadsheet-logo-application-software-slack-logo.jpg",
    "d0e7efc9e32100c51fe9be49fd601832131655822ea1823f29448fd6661c1d9b.png",
    "download.png","ers-logo.svg","iWorQ.png","images.png",
    "istockphoto-2208485481-612x612.jpg","logo-seeclickfix.png",
    "opengov-logo-may-2025.png",
    "png-clipart-logo-salesforce-com-brand-font-desktop-cloud-computing-text-cloud.png"
  ];

  function shuffle(a) {
    const b = [...a];
    for (let i = b.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  // ---- City seals ----
  const grid = document.getElementById('cities-grid');
  const shuffledSeals = shuffle(ALL_SEAL_IDS);
  const sealCards = [];

  shuffledSeals.slice(0, 78).forEach(id => {
    const card = document.createElement('div');
    card.className = 'city-seal flip-card';
    const inner = document.createElement('div');
    inner.className = 'flip-card-inner';
    const front = document.createElement('div');
    front.className = 'flip-face flip-front';
    front.innerHTML = `<img src="city_seals/${id}.png">`;
    const back = document.createElement('div');
    back.className = 'flip-face flip-back';
    back.innerHTML = `<img src="city_seals/${pick(ALL_SEAL_IDS)}.png">`;
    inner.append(front, back);
    card.appendChild(inner);
    grid.appendChild(card);
    sealCards.push({ el: card, front, back, showingFront: true });
  });

  function flipSeal() {
    const c = pick(sealCards);
    const face = c.showingFront ? c.back : c.front;
    face.innerHTML = `<img src="city_seals/${pick(ALL_SEAL_IDS)}.png">`;
    c.el.classList.toggle('flipped');
    c.showingFront = !c.showingFront;
    setTimeout(flipSeal, 2000 + Math.random() * 3000);
  }
  setTimeout(flipSeal, 1500);
  setTimeout(() => {
    (function f2() {
      const c = pick(sealCards);
      const face = c.showingFront ? c.back : c.front;
      face.innerHTML = `<img src="city_seals/${pick(ALL_SEAL_IDS)}.png">`;
      c.el.classList.toggle('flipped');
      c.showingFront = !c.showingFront;
      setTimeout(f2, 2500 + Math.random() * 3500);
    })();
  }, 2800);

  // ---- Data source logos ----
  function buildSources(allFiles) {
    const col = document.getElementById('sources-col');
    const linesGroup = document.getElementById('source-lines');
    const svgNS = 'http://www.w3.org/2000/svg';

    const SLOTS = 6;
    const shuffled = shuffle(allFiles);
    const visible = shuffled.slice(0, SLOTS);
    const sourceCards = [];

    const COL_TOP = 120;
    const SLOT_STEP = 42;
    const CITIES_RIGHT = 182;
    const LOGO_LEFT = 220;
    const LOGO_RIGHT = 310;
    const ANGEL_LEFT = 380;

    visible.forEach((file, i) => {
      const cy = COL_TOP + i * SLOT_STEP + 19;

      const card = document.createElement('div');
      card.className = 'source-slot flip-card';
      const inner = document.createElement('div');
      inner.className = 'flip-card-inner';
      const front = document.createElement('div');
      front.className = 'flip-face flip-front';
      front.innerHTML = `<img src="data_sources/${file}">`;
      const back = document.createElement('div');
      back.className = 'flip-face flip-back';
      back.innerHTML = `<img src="data_sources/${pick(allFiles)}">`;
      inner.append(front, back);
      card.appendChild(inner);
      col.appendChild(card);
      sourceCards.push({ el: card, front, back, showingFront: true });

      // Line: cities → logo
      const l1 = document.createElementNS(svgNS, 'line');
      l1.setAttribute('x1', CITIES_RIGHT);
      l1.setAttribute('y1', cy);
      l1.setAttribute('x2', LOGO_LEFT);
      l1.setAttribute('y2', cy);
      l1.setAttribute('stroke', '#ccc');
      l1.setAttribute('stroke-width', '1');
      linesGroup.appendChild(l1);

      // Line: logo → Angel
      const l2 = document.createElementNS(svgNS, 'line');
      l2.setAttribute('x1', LOGO_RIGHT);
      l2.setAttribute('y1', cy);
      l2.setAttribute('x2', ANGEL_LEFT);
      l2.setAttribute('y2', cy);
      l2.setAttribute('stroke', '#7c3aed');
      l2.setAttribute('stroke-width', '1.5');
      l2.setAttribute('opacity', '0.5');
      linesGroup.appendChild(l2);
    });

    function flipSource() {
      const c = pick(sourceCards);
      const face = c.showingFront ? c.back : c.front;
      face.innerHTML = `<img src="data_sources/${pick(allFiles)}">`;
      c.el.classList.toggle('flipped');
      c.showingFront = !c.showingFront;
      setTimeout(flipSource, 3000 + Math.random() * 4000);
    }
    setTimeout(flipSource, 2000);
  }

  fetch('data_sources_manifest.json')
    .then(r => r.json())
    .then(buildSources)
    .catch(() => buildSources(FALLBACK_SOURCES));
</script>

</body>
</html>
